server {
    listen 80;
    listen [::]:80;
    server_name gsw-ecommerce.local;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gsw-ecommerce.local;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/gsw-ecommerce.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gsw-ecommerce.local/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM;
    ssl_ecdh_curve prime256v1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self' https://fonts.gstatic.com;" always;

    # Document Root
    root /var/www/gsw-ecommerce/public;

    # Index
    index index.php index.html;

    # Charset
    charset utf-8;

    # Logging
    access_log /var/log/nginx/gsw-ecommerce-access.log;
    error_log /var/log/nginx/gsw-ecommerce-error.log;

    # Max Upload Size
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Main Location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # PHP Settings
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    # Block Hidden Files (.htaccess, .git, .env, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Laravel Routes
    location ~ ^/(?:index|robots)\.php$ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Assets Cache
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|gif|jpe?g|png|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Archivos públicos de Laravel (storage:link): imágenes y comprobantes
    location ^~ /storage/ {
        alias /var/www/gsw-ecommerce/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        # Nunca ejecutar PHP desde uploads
        location ~ \.php$ {
            deny all;
            return 404;
        }
    }

    # Deny access to sensitive files
    location ~* \.(env|log|lock|md|txt|yml|yaml|xml|dist|example)$ {
        deny all;
        return 404;
    }
}
